<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER MANAGEMENT</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #eef2f5; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container { 
            background: #ffffff; 
            width: 100%;
            max-width: 650px;
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            border: 2px solid #b22222;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #b22222;
            color: white;
            padding: 10px 20px;
            margin: -30px -30px 20px -30px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            font-weight: bold;
        }
        .back-link {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover { text-decoration: underline; }

        /* Header Logo & Title */
        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-section img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .header-section h2 {
            margin: 0;
            color: #003366;
            font-size: 20px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 160px 1fr;
            align-items: center;
            margin-bottom: 12px;
        }
        .form-group label {
            font-weight: bold;
            font-size: 13px;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #007bff;
        }
        .form-group input:disabled {
            background-color: #e9ecef;
            color: #6c757d;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }
        .btn {
            padding: 8px 25px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #f8f9fa;
            transition: background 0.2s;
        }
        .btn-save { background: #28a745; color: white; border-color: #218838; }
        .btn-save:hover { background: #218838; }
        
        .btn-add { background: #ffc107; color: #333; border-color: #e0a800; }
        .btn-add:hover { background: #e0a800; }

        .btn-admin { background: #007bff; color: white; border-color: #0056b3; }
        .btn-admin:hover { background: #0056b3; }

        .btn-close { background: #6c757d; color: white; border-color: #5a6268; }
        .btn-close:hover { background: #5a6268; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="top-bar">
        <span>🗔 USER MANAGEMENT</span>
        <a href="/dashboard.html" class="back-link">← Main Menu</a>
    </div>

    <div class="header-section">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="User Management Icon">
        <h2>USER MANAGEMENT</h2>
    </div>
    
    <form id="userForm">
        <div class="form-group">
            <label for="txtUserId">USER_id</label>
            <input type="text" id="txtUserId" value="(Auto)" disabled>
        </div>

        <div class="form-group">
            <label for="txtUserName">USER_NAME</label>
            <input type="text" id="txtUserName" required autocomplete="off" placeholder="ឧ. admin ឬ username">
        </div>

        <div class="form-group">
            <label for="txtPassworld">PASSWORD</label>
            <input type="password" id="txtPassworld" required autocomplete="off" placeholder="បញ្ចូលពាក្យសម្ងាត់...">
        </div>

        <div class="form-group">
            <label for="txtFullName">FULL_NAME</label>
            <input type="text" id="txtFullName" autocomplete="off" placeholder="ឈ្មោះពេញ...">
        </div>

        <div class="form-group">
            <label for="cmbRole">ROLE</label>
            <select id="cmbRole" onchange="toggleShippingLineField()">
                <option value="Admin">Admin</option>
                <option value="Operation">Operation</option>
                <option value="Supervisor">Supervisor</option>
                <option value="shipping_line">Shipping Line</option>
            </select>
        </div>

        <!-- ប្រអប់បញ្ជាក់ឈ្មោះ Shipping Line (បង្ហាញពេលជ្រើសរើស Role ជា Shipping Line) -->
        <div class="form-group" id="shippingLineGroup" style="display: none;">
            <label for="txtShippingLine">SHIPPING LINE</label>
            <input type="text" id="txtShippingLine" placeholder="ឧ. HMM, SITC, MSC..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="cmbActive">ACTIVE</label>
            <select id="cmbActive">
                <option value="Active">Active</option>
                <option value="UnActive">UnActive</option>
            </select>
        </div>

        <div class="form-group">
            <label for="txtLastLogin">LAST_LOGIN</label>
            <input type="text" id="txtLastLogin" disabled>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-save">SAVE</button>
            <button type="button" class="btn btn-add" onclick="addNewUser()">Add New</button>
            <button type="button" class="btn btn-admin" onclick="fillAdminDefault()">Quick Admin</button>
            <button type="button" class="btn btn-close" onclick="window.location.href='/dashboard.html'">CLOSE</button>
        </div>
    </form>
</div>

<script>
    const API_BASE = window.location.origin;

    async function logUserActivity(action, module, containerNo, description) {
        let userName = localStorage.getItem("currentUser") || "System";
        let fullName = localStorage.getItem("currentUserFullName") || userName;

        try {
            await fetch(`${API_BASE}/api/activity-log`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_name: userName,
                    full_name: fullName,
                    action: action,
                    module: module,
                    container_no: containerNo,
                    description: description
                })
            });
        } catch (err) {
            console.error("Failed to log activity:", err);
        }
    }

    window.onload = () => {
        clearFields();
        // កំណត់ Role ដើមឱ្យទៅជា Admin ស្រាប់ដើម្បីងាយស្រួលបង្កើត Admin ដំបូង
        document.getElementById('cmbRole').value = "Admin";
    };

    function toggleShippingLineField() {
        let role = document.getElementById('cmbRole').value;
        let shippingLineGroup = document.getElementById('shippingLineGroup');
        let shippingLineInput = document.getElementById('txtShippingLine');

        if (role === "shipping_line") {
            shippingLineGroup.style.display = "grid";
            shippingLineInput.required = true;
        } else {
            shippingLineGroup.style.display = "none";
            shippingLineInput.required = false;
            shippingLineInput.value = "";
        }
    }

    // មុខងារបំពេញទិន្នន័យ Admin ស្វ័យប្រវត្តិដើម្បីភាពងាយស្រួល
    function fillAdminDefault() {
        document.getElementById('txtUserName').value = "admin";
        document.getElementById('txtPassworld').value = "admin123";
        document.getElementById('txtFullName').value = "System Administrator";
        document.getElementById('cmbRole').value = "Admin";
        document.getElementById('cmbActive').value = "Active";
        toggleShippingLineField();
        alert("បានបំពេញព័ត៌មាន Admin រួចរាល់! សូមចុចប៊ូតុង SAVE ជាការស្រេច។");
    }

    function clearFields() {
        document.getElementById('txtUserId').value = "(Auto)";
        document.getElementById('txtUserName').value = "";
        document.getElementById('txtPassworld').value = "";
        document.getElementById('txtFullName').value = "";
        document.getElementById('cmbRole').value = "Admin";
        document.getElementById('txtShippingLine').value = "";
        document.getElementById('shippingLineGroup').style.display = "none";
        document.getElementById('cmbActive').value = "Active";
        document.getElementById('txtLastLogin').value = "";
        document.getElementById('txtUserName').focus();
    }

    function addNewUser() {
        clearFields();
    }

    // ព្រឹត្តិការណ៍ពេលចុច SAVE (ផ្ញើទិន្នន័យទៅកាន់ Cloud API)
    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        let strUser = document.getElementById('txtUserName').value.trim();
        let strPass = document.getElementById('txtPassworld').value.trim();
        let strRole = document.getElementById('cmbRole').value;
        let strShippingLine = document.getElementById('txtShippingLine').value.trim();
        let strActive = document.getElementById('cmbActive').value;
        let strFullName = document.getElementById('txtFullName').value.trim();

        if (!strUser) {
            alert("Please enter User Name!");
            document.getElementById('txtUserName').focus();
            return;
        }

        if (!strPass) {
            alert("Please enter Password!");
            document.getElementById('txtPassworld').focus();
            return;
        }

        if (strRole === "shipping_line" && !strShippingLine) {
            alert("សូមបញ្ជាក់ឈ្មោះ Shipping Line ឱ្យបានត្រឹមត្រូវ!");
            document.getElementById('txtShippingLine').focus();
            return;
        }

        let payload = {
            username: strUser,
            password: strPass,
            role: strRole,
            shipping_line: strShippingLine,
            full_name: strFullName,
            active: strActive
        };

        try {
            let res = await fetch(`${API_BASE}/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            let resultJson = await res.json().catch(() => ({}));

            if (res.status === 201 || res.status === 200 || res.ok) {
                alert("Data saved to Cloud Database successfully!");
                await logUserActivity("ADD_USER", "USER_MANAGEMENT", "", `Created new user account: ${strUser} (Role: ${strRole})`);
                clearFields();
            } else {
                alert("Failed to save to Cloud: " + (resultJson.message || resultJson.error || "Unknown error"));
            }
        } catch (err) {
            console.error("Error saving user:", err);
            alert("Connection Error: " + err.message);
        }
    });
</script>

</body>
</html>
